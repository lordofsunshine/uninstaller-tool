[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uninstaller-tool"
description = "A small, careful Windows program uninstaller"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7,<7",
    "psutil>=5.9,<8",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.version.APP_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["app", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/config.py" = ["E501"]
"app/theme/style.py" = ["E501"]
